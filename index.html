<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zaki Salon | Price List</title>
<meta name="description" content="Zaki Salon price list — choose Gents or Ladies to view the full menu. Palm Jumeirah, Dubai.">
<meta name="theme-color" content="#0b0806">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital@0;1&family=Manrope:wght@400;600&family=Tajawal:wght@400&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="media/gents-menu.jpg">
<link rel="preload" as="image" href="media/ladies-menu.jpg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0806}
body{font-family:'Manrope','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{text-decoration:none}
.zk{position:fixed;inset:0;display:flex;background:#0b0806}
.side{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 24px clamp(56px,11vh,130px);color:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent;isolation:isolate}

/* living backgrounds: slow cinematic drift */
.bg{position:absolute;inset:-3%;background-size:cover;background-repeat:no-repeat;will-change:transform}
.g .bg{background-image:url("media/gents-menu.jpg");background-position:50% 40%;background-color:#2a1a0e;animation:driftG 22s ease-in-out infinite alternate}
.l .bg{background-image:url("media/ladies-menu.jpg");background-position:50% 50%;background-color:#c99683;animation:driftL 24s ease-in-out infinite alternate}
@keyframes driftG{from{transform:scale(1.04) translate(-1.2%,0)}to{transform:scale(1.16) translate(1.2%,-1.5%)}}
@keyframes driftL{from{transform:scale(1.14) translate(1%,-1%)}to{transform:scale(1.04) translate(-1%,1%)}}

.side::after{content:"";position:absolute;inset:0;z-index:1}
.g::after{background:linear-gradient(180deg,rgba(11,8,6,.72),rgba(11,8,6,.28) 32%,rgba(11,8,6,.32) 55%,rgba(11,8,6,.93))}
.l::after{background:linear-gradient(180deg,rgba(60,30,22,.55),rgba(80,40,28,.42) 45%,rgba(58,28,20,.93))}

/* warm light that breathes like the salon lamps */
.glow{position:absolute;z-index:1;border-radius:50%;filter:blur(60px);pointer-events:none;mix-blend-mode:screen}
.g .glow{width:60%;height:45%;left:20%;top:28%;background:radial-gradient(circle,rgba(255,190,110,.35),transparent 70%);animation:breathe 4.6s ease-in-out infinite}
.l .glow{width:60%;height:45%;left:20%;top:26%;background:radial-gradient(circle,rgba(255,215,200,.3),transparent 70%);animation:breathe 5.4s ease-in-out infinite -2s}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}38%{opacity:.95}52%{opacity:.75}70%{opacity:1;transform:scale(1.08)}}

/* light sweep across each panel */
.sweep{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(110deg,transparent 42%,rgba(255,236,200,.13) 50%,transparent 58%);background-size:250% 100%;animation:sweep 9s ease-in-out infinite}
.l .sweep{animation-delay:-4.5s}
@keyframes sweep{0%,60%{background-position:130% 0}100%{background-position:-30% 0}}

.side>.txt{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center}
.side small{font-size:11px;letter-spacing:.42em;text-transform:uppercase;opacity:.9;padding-left:.42em}
.side h2{font-family:'Bodoni Moda','Didot','Times New Roman',serif;font-weight:400;font-style:italic;font-size:clamp(46px,6.4vw,84px);line-height:1.05;margin:10px 0 6px;text-shadow:0 6px 30px rgba(0,0,0,.45)}
.g h2{color:#ecd29a}.l h2{color:#ffd9cf}
.ar{font-family:'Tajawal',Arial,sans-serif;font-size:17px;opacity:.88}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;margin-top:24px;min-height:54px;padding:0 32px;border-radius:100px;font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;transition:transform .4s}
.btn i{font-style:normal;display:inline-block;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 4.2s ease-in-out infinite}
.l .btn::after{animation-delay:-2.1s;background:linear-gradient(100deg,transparent,rgba(216,167,160,.55),transparent)}
@keyframes shine{0%,65%{left:-60%}100%{left:140%}}
.g .btn{background:#c9a45c;color:#140f06;animation:pulseG 3s ease-in-out infinite}
.l .btn{background:#fff;color:#8a5240;animation:pulseL 3s ease-in-out infinite -1.5s}
@keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(201,164,92,.55),0 14px 34px -14px #c9a45c}50%{box-shadow:0 0 0 12px rgba(201,164,92,0),0 14px 34px -14px #c9a45c}}
@keyframes pulseL{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.5),0 14px 34px -14px rgba(255,255,255,.7)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0),0 14px 34px -14px rgba(255,255,255,.7)}}
.side:hover .btn{transform:translateY(-3px)}
.side:active .btn{transform:scale(.97)}

.top{position:absolute;left:0;right:0;top:0;z-index:5;text-align:center;padding:calc(30px + env(safe-area-inset-top)) 16px 0;pointer-events:none;color:#f3e2bd}
.zk-logo{width:min(220px,48vw);height:auto;filter:drop-shadow(0 6px 20px rgba(0,0,0,.6))}
.top p{margin-top:12px;font-size:11px;letter-spacing:.55em;text-transform:uppercase;padding-left:.55em;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.top p span{display:block;margin-top:8px;font-family:'Tajawal',Arial,sans-serif;font-size:16px;letter-spacing:0;text-transform:none}
.seam{position:absolute;left:50%;top:22%;bottom:12%;width:1px;z-index:4;background:linear-gradient(transparent,rgba(236,210,154,.8),transparent);transform-origin:top;animation:seam 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
@keyframes seam{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.foot{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;text-align:center;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(243,226,189,.75);pointer-events:none}
#dust{position:absolute;inset:0;z-index:4;pointer-events:none}

/* entrance */
.in{opacity:0;transform:translateY(22px);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.top.in{animation-delay:.1s}.g .txt.in{animation-delay:.35s}.l .txt.in{animation-delay:.55s}.foot.in{animation-delay:.9s}
@keyframes rise{to{opacity:1;transform:none}}
.zk::before{content:"";position:absolute;inset:0;z-index:9;background:#0b0806;pointer-events:none;animation:lift 1.2s ease .05s forwards}
@keyframes lift{to{opacity:0}}

@media (max-width:760px){
  .zk{flex-direction:column}
  .side{justify-content:flex-end;padding:0 20px 18px}
  .g{flex:1.2;padding-bottom:22px}
  .g .bg{background-position:50% 32%}
  .g::after{background:linear-gradient(180deg,rgba(11,8,6,.9),rgba(11,8,6,.35) 42%,rgba(11,8,6,.3) 60%,rgba(11,8,6,.9))}
  .l{justify-content:center;padding-bottom:46px}
  .side h2{font-size:42px;margin:4px 0 2px}
  .btn{margin-top:14px;min-height:50px}
  .seam{display:none}
  .zk-logo{width:150px}
  .top p{margin-top:6px}
  .foot{bottom:calc(12px + env(safe-area-inset-bottom))}
}
@media (max-width:760px) and (max-height:720px){
  .zk-logo{width:118px}
  .top p span,.side small,.ar{display:none}
  .side h2{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.in{opacity:1;transform:none}#dust{display:none}}
</style>
</head>

<script>
/* floating gold dust */
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=document.getElementById('dust'),x=c.getContext('2d');let W,H,D,ps=[];
  function size(){D=Math.min(window.devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}
  function mk(r){return{x:Math.random()*W,y:r?Math.random()*H:H+10,s:.6+Math.random()*2.2,v:.15+Math.random()*.45,dr:(Math.random()-.5)*.3,a:0,t:.25+Math.random()*.6,ph:Math.random()*6.28}}
  function init(){size();ps=[];const n=Math.round(Math.min(70,W*H/16000));for(let i=0;i<n;i++)ps.push(mk(true))}
  let last=0;
  function tick(t){const dt=Math.min(50,t-last)/16.7;last=t;x.clearRect(0,0,W,H);
    for(const p of ps){p.y-=p.v*dt;p.x+=Math.sin(t/1400+p.ph)*.25+p.dr;p.a+=(p.t-p.a)*.02;
      const fade=Math.min(1,p.y/(H*.25));
      if(p.y<-10){Object.assign(p,mk(false));continue}
      const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*3);
      g.addColorStop(0,`rgba(255,232,180,${p.a*fade})`);g.addColorStop(1,'rgba(255,210,140,0)');
      x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.s*3,0,6.283);x.fill()}
    requestAnimationFrame(tick)}
  addEventListener('resize',init);init();requestAnimationFrame(tick);
})();
</script>
